name: Agentring
options:
  bundleIdPrefix: dev.agentring
  deploymentTarget:
    iOS: "17.0"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.17.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Agentring:
    type: application
    platform: iOS
    sources: [Sources/Agentring, Sources/AgentringCore, Resources/Assets.xcassets]
    dependencies:
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentring.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: agentring
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APNS_ENVIRONMENT: development
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Resources/Simulator.entitlements
      configs:
        Release:
          APNS_ENVIRONMENT: production
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Talk to your AI agents during calls.
        NSCameraUsageDescription: Scan your relay's pairing QR code.
        NSLocalNetworkUsageDescription: Connect to your self-hosted relay on your local network.
        UIBackgroundModes: [audio, voip, remote-notification]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        APNSEnvironment: $(APNS_ENVIRONMENT)
    entitlements:
      path: Resources/Agentring.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
  AgentringUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Agentring
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentring.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Agentring:
    build:
      targets:
        Agentring: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets: [AgentringUITests]
